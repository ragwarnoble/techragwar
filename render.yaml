services:
  - type: web
    name: ragwar-tech-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health

    envVars:
      - key: AI_PROVIDER
        value: openai

      - key: AI_MODEL
        value: gpt-5.6-luna

      - key: OPENAI_API_KEY
        sync: false

      - key: CORS_ORIGINS
        sync: false
